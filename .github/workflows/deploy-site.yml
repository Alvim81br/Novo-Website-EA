# Deploy do site no Cloudflare Workers (arquivos estáticos) a cada merge no main.
#
# Requer dois segredos no repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token com o template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  — ID da conta (painel Cloudflare → Workers & Pages)
#
# Enquanto os segredos não existirem, o deploy é pulado com um aviso (sem
# quebrar o CI). A configuração do site fica em wrangler.jsonc.
name: Deploy site (Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Build do site
        run: npm run build

      - name: Publica no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Segredos CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ainda não configurados — deploy pulado."
            exit 0
          fi
          npx wrangler@4 deploy
